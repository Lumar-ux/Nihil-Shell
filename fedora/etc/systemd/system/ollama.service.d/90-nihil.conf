# 90-nihil.conf by poligle (fedora)
#
# modules/nilo.nix for the ollama.service of Ollama's own installer (CUDA
# through the host's NVIDIA driver). Local only, one model in memory at a
# time, and restarts with a back-off when it stops on its own. No
# OLLAMA_IGPU_ENABLE: the model runs on the discrete GPU.

[Service]
Environment=OLLAMA_HOST=127.0.0.1:11434
Environment=OLLAMA_KEEP_ALIVE=5m
Environment=OLLAMA_MAX_LOADED_MODELS=1
Environment=OLLAMA_NO_CLOUD=1
Restart=on-failure
RestartSec=2s
RestartSteps=5
RestartMaxDelaySec=1min
