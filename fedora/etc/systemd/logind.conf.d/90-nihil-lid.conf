# 90-nihil-lid.conf by poligle (fedora)
#
# services.logind (modules/hardware.nix): logind leaves the lid alone and
# Hyprland handles it (home/hyprland.nix). Closed with another output on,
# the laptop panel turns off; closed alone, the session locks and the panel
# turns off. Nothing suspends on the lid, in GNOME either: hypridle
# suspends after 15 minutes idle. Read at boot; do not restart logind,
# that ends every session.

[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
